services:
  dubbing:
    build: .
    container_name: video-dubbing
    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: ${GPU:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN}

      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8_float16}

      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-Helsinki-NLP/opus-mt-ja-en}
      TRANSLATION_MODEL_DIR: /models/translation
      TRANSLATION_DEVICE: ${TRANSLATION_DEVICE:-auto}
      TRANSLATION_MAX_LENGTH: ${TRANSLATION_MAX_LENGTH:-256}

    volumes:
      - ./app:/app/app
      - ./input:/input
      - ./work:/work
      - ./output:/output
      - ./models:/models
